# GitHub-hosted runner → ntfy.sh
# Cloudflare Workers share egress IPs that ntfy.sh rate-limits; Actions does not.
#
# Triggers:
#   - Actions UI: workflow_dispatch
#   - API: POST /repos/BitDevsDMV/bitdevsdmv/dispatches
#     { "event_type": "ntfy", "client_payload": { "title": "...", "message": "..." } }

name: ntfy

on:
  workflow_dispatch:
    inputs:
      title:
        description: Notification title
        required: true
        default: BitDevs DMV
      message:
        description: Notification body
        required: true
  repository_dispatch:
    types: [ntfy]

permissions: {}

concurrency:
  group: ntfy
  cancel-in-progress: true

jobs:
  send:
    name: Send ntfy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish to ntfy
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TITLE: ${{ github.event.inputs.title || github.event.client_payload.title || 'BitDevs DMV' }}
          NTFY_MESSAGE: ${{ github.event.inputs.message || github.event.client_payload.message }}
          NTFY_TAGS: ${{ github.event.client_payload.tags || 'mailbox_with_mail,bitcoin' }}
        run: |
          set -euo pipefail
          if [ -n "${NTFY_URL:-}" ]; then
            echo "::add-mask::${NTFY_URL}"
          fi
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlparse

          raw = os.environ.get("NTFY_URL", "").strip().strip("\"'")
          if not raw:
              sys.exit("NTFY_URL secret is not set")

          message = (os.environ.get("NTFY_MESSAGE") or "").strip()
          if not message:
              sys.exit("message is empty")

          title = (os.environ.get("NTFY_TITLE") or "BitDevs DMV").strip() or "BitDevs DMV"
          tags = [t.strip() for t in (os.environ.get("NTFY_TAGS") or "").split(",") if t.strip()]

          if "://" not in raw and "/" not in raw:
              raw = f"https://ntfy.sh/{raw}"
          elif "://" not in raw:
              raw = f"https://{raw}"

          parsed = urlparse(raw)
          host = (parsed.hostname or "").lower()
          topic = parsed.path.strip("/").split("/")[0] if parsed.path else ""
          if not topic:
              sys.exit("NTFY_URL has no topic path")

          private = (
              host.endswith(".ts.net")
              or host.endswith(".local")
              or host.endswith(".internal")
              or host.startswith("100.")
              or host.startswith("10.")
              or host.startswith("192.168.")
              or host in {"localhost", "zeus"}
          )
          # GitHub-hosted runners cannot resolve Tailscale/LAN. Always use public ntfy.
          server = "https://ntfy.sh" if (private or host in {"", "ntfy.sh"}) else f"{parsed.scheme}://{parsed.netloc}"

          payload = {
              "topic": topic,
              "title": title[:80],
              "message": message[:1900],
              "tags": tags or ["mailbox_with_mail", "bitcoin"],
          }
          open("/tmp/ntfy-payload.json", "w", encoding="utf-8").write(json.dumps(payload))
          open("/tmp/ntfy-server.txt", "w", encoding="utf-8").write(server)
          print(f"publishing via {server}")
          PY
          NTFY_SERVER="$(cat /tmp/ntfy-server.txt)"
          echo "dns:"
          getent ahosts ntfy.sh | head -5 || true
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --retry-connrefused \
            --connect-timeout 10 --max-time 30 \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/ntfy-payload.json \
            "${NTFY_SERVER}"
          echo
          echo "ntfy sent"
